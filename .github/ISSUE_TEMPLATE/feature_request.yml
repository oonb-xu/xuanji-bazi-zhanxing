name: ✨ 功能建议
description: 提出一个新功能或改进
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在有什么不便？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你的方案
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: 涉及哪一层？
      options:
        - 几何层（黄经/时角/ASC）
        - 计数层（年柱/日柱）
        - 符号层（藏干/十神/神煞/宫名）
        - 前端/交互
        - 文档
        - 不确定
    validations:
      required: true
