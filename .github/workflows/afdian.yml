name: Add afdian link

# 把爱发电链接填回去。
# 只改「含『爱发电』且含 github.com/oonb-xu」的行 —— 避免误改 clone / homepage 里的同名链接。
# 并跳过 .github/workflows/（GITHUB_TOKEN 无权改工作流）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  afdian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 填爱发电链接
        run: |
          python3 - <<'PY'
          import os

          AFDIAN = 'https://afdian.com/a/XuanJi-tool'

          def skip(fp):
              p = fp.replace('\\', '/')
              return p.startswith('./.github/workflows/') or '/.github/workflows/' in p

          # 1) FUNDING.yml 的 custom 行
          p = '.github/FUNDING.yml'
          if os.path.exists(p):
              out = []
              for line in open(p, encoding='utf-8').read().splitlines():
                  s = line.strip()
                  if s.startswith('# custom:') or s.startswith('custom:'):
                      out.append("custom: ['" + AFDIAN + "']")
                  else:
                      out.append(line)
              open(p, 'w', encoding='utf-8').write('\n'.join(out) + '\n')
              print('FUNDING.yml done')

          # 2) 含「爱发电」的行
          n = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules')]
              for f in files:
                  if not f.endswith(('.md', '.html', '.yml', '.yaml')):
                      continue
                  fp = os.path.join(root, f)
                  if skip(fp):
                      continue
                  src = open(fp, encoding='utf-8').read()
                  out = []
                  changed = False
                  for line in src.splitlines():
                      if '爱发电' in line and 'github.com/oonb-xu' in line:
                          line = line.replace('https://github.com/oonb-xu', AFDIAN)
                          changed = True
                      out.append(line)
                  if changed:
                      open(fp, 'w', encoding='utf-8').write('\n'.join(out) + '\n')
                      print('fixed', fp)
                      n += 1
          print('replaced', n, 'files')
          PY

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feat: 填入爱发电支持链接"
            git push
          fi
