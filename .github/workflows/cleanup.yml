name: Cleanup afdian placeholder

# 爱发电暂时不开通：
#   1) .github/FUNDING.yml 去掉 custom 链接（否则仓库右上角会出现死链赞助按钮）
#   2) 其它文件里的爱发电占位链接改成 GitHub 主页
#   注意：必须跳过 .github/workflows/ —— GITHUB_TOKEN 无权改工作流文件，
#        否则 git push 会被拒（本文件自身也含占位串，不跳过会改到自己）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 清理占位链接
        run: |
          python3 - <<'PY'
          import os

          PLACEHOLDER = 'afdian' + '.com/@YOUR' + '_ID'

          def skip(fp):
              p = fp.replace('\\', '/')
              return p.startswith('./.github/workflows/') or '/.github/workflows/' in p

          # 1) FUNDING.yml
          p = '.github/FUNDING.yml'
          if os.path.exists(p):
              src = open(p, encoding='utf-8').read().splitlines()
              out = []
              for line in src:
                  if line.strip().startswith('custom:'):
                      out.append('# custom: []   # 爱发电开通后把链接填这里')
                  else:
                      out.append(line)
              open(p, 'w', encoding='utf-8').write('\n'.join(out) + '\n')
              print('FUNDING.yml done')

          # 2) 其它文件
          n = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules')]
              for f in files:
                  if not f.endswith(('.md', '.html', '.yml', '.yaml')):
                      continue
                  fp = os.path.join(root, f)
                  if skip(fp):
                      print('skip workflow:', fp)
                      continue
                  t = open(fp, encoding='utf-8').read()
                  if PLACEHOLDER not in t:
                      continue
                  t = t.replace('https://' + PLACEHOLDER, 'https://github.com/oonb-xu')
                  open(fp, 'w', encoding='utf-8').write(t)
                  print('fixed', fp)
                  n += 1
          print('replaced', n, 'files')
          PY

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: afdian 暂未开通，占位链接改为 GitHub 主页"
            git push
          fi
