name: Cleanup afdian placeholder

# 爱发电暂时不开通：
#   1) .github/FUNDING.yml 去掉 custom 链接（否则仓库右上角会出现死链赞助按钮）
#   2) 其它文件里的 https://afdian.com/@YOUR_ID 改成 GitHub 主页

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 清理占位链接
        run: |
          python3 - <<'PY'
          import os

          # 1) FUNDING.yml
          p = '.github/FUNDING.yml'
          if os.path.exists(p):
              src = open(p, encoding='utf-8').read().splitlines()
              out = []
              for line in src:
                  if line.strip().startswith('custom:'):
                      out.append("# custom: ['https://afdian.com/@你的ID']   # 爱发电开通后填这里")
                  else:
                      out.append(line)
              open(p, 'w', encoding='utf-8').write('\n'.join(out) + '\n')
              print('FUNDING.yml 已处理')

          # 2) 其它文件
          n = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules')]
              for f in files:
                  if not f.endswith(('.md', '.html', '.yml', '.yaml')):
                      continue
                  fp = os.path.join(root, f)
                  t = open(fp, encoding='utf-8').read()
                  if 'afdian.com/@YOUR_ID' not in t:
                      continue
                  t = t.replace('https://afdian.com/@YOUR_ID', 'https://github.com/oonb-xu')
                  open(fp, 'w', encoding='utf-8').write(t)
                  print('fixed', fp)
                  n += 1
          print('共替换', n, '个文件')
          PY

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore: 爱发电暂未开通，占位链接改为 GitHub 主页"
            git push
          fi
