name: Unpack

# 兼容 PowerShell Compress-Archive 打的「反斜杠路径」zip：
# 用 Python 解包并把 \ 规范成 /，否则 Linux 的 unzip 会把它们当成文件名的一部分。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压
        run: |
          python3 - <<'PY'
          import os, shutil, zipfile
          src = 'xuanji-minglironghe.zip'
          if not os.path.exists(src):
              print('zip 不存在，跳过')
              raise SystemExit(0)
          n = 0
          with zipfile.ZipFile(src) as z:
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  name = info.filename.replace('\\', '/').lstrip('/')
                  dst = os.path.join('.', name)
                  os.makedirs(os.path.dirname(dst) or '.', exist_ok=True)
                  with z.open(info) as f, open(dst, 'wb') as o:
                      shutil.copyfileobj(f, o)
                  n += 1
          print('解出', n, '个文件')
          PY
          rm -f xuanji-minglironghe.zip
          echo '--- 根目录 ---'
          ls -la | head -30 || true

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "unpack: 展开 zip 为源码目录（594 个文件）" || echo "无变更"
          git push
